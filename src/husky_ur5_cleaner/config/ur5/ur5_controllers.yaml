
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    # Controller types MUST be declared here in Jazzy
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ur5_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Controller-specific parameters live in their own top-level section
ur5_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 5.0